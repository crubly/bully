name: Build unsigned macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build macos --release

      - name: Ad-hoc sign the whole bundle (incl. nested frameworks)
        run: |
          codesign --force --deep --sign - \
            --entitlements macos/Runner/Release.entitlements \
            "build/macos/Build/Products/Release/Bully.app"
          codesign --verify --deep --strict "build/macos/Build/Products/Release/Bully.app"
          codesign -d --entitlements - "build/macos/Build/Products/Release/Bully.app"

      - name: Package DMG
        run: |
          cd build/macos/Build/Products/Release
          mkdir -p dmg_root
          cp -r Bully.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Bully" -srcfolder dmg_root -ov -format UDZO bully-unsigned.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: bully-unsigned-dmg
          path: client/build/macos/Build/Products/Release/bully-unsigned.dmg
