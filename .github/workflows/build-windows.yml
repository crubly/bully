name: Build unsigned Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/**'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Zip release bundle
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\x64\runner\Release\bully-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: bully-windows
          path: client/build/windows/x64/runner/Release/bully-windows.zip
