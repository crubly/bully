name: Build unsigned Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # Debug build needs no signing config/keystore, so it's the simplest
      # "no Apple/Google account required" way to get an installable APK.
      # Switch to `flutter build apk --release` once a real keystore is
      # wired up (needs android/key.properties + a signingConfig, not
      # present here on purpose — this is unsigned CI output).
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: bully-android-debug
          path: client/build/app/outputs/flutter-apk/app-debug.apk
